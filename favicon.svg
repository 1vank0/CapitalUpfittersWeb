<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40">
  <!-- Capital Upfitters CU shield (Nov 2026) -->
  <!-- Black shield body -->
  <path d="M3.5 6.5 L20 3 L36.5 6.5 L36.5 18 C36.5 27.5 30 35 20 37.5 C10 35 3.5 27.5 3.5 18 Z" fill="#000000"/>
  <!-- White inner stroke -->
  <path d="M5.5 8 L20 5 L34.5 8 L34.5 18 C34.5 26.5 28.8 33.4 20 35.7 C11.2 33.4 5.5 26.5 5.5 18 Z"
        fill="none" stroke="#ffffff" stroke-width="1.4" stroke-linejoin="round"/>
  <!-- Vertical seam through the lower half -->
  <line x1="20" y1="22" x2="20" y2="35" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round"/>
  <!-- Letters: blue C + gold U -->
  <text x="13" y="24" text-anchor="middle"
        font-family="Impact, 'Arial Narrow Bold', 'Arial Black', sans-serif"
        font-size="16" font-weight="900" fill="#103b68" letter-spacing="-0.6">C</text>
  <text x="27" y="24" text-anchor="middle"
        font-family="Impact, 'Arial Narrow Bold', 'Arial Black', sans-serif"
        font-size="16" font-weight="900" fill="#fcbf0d" letter-spacing="-0.6">U</text>
</svg>
